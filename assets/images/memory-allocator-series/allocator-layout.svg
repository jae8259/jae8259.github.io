<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">Allocator layout</title>
  <desc id="desc">A simple free list allocator diagram with a used block, a free block, and another used block.</desc>
  <rect width="720" height="180" fill="#ffffff"/>
  <rect x="40" y="60" width="180" height="60" rx="8" fill="#2563eb"/>
  <rect x="270" y="60" width="180" height="60" rx="8" fill="#16a34a"/>
  <rect x="500" y="60" width="180" height="60" rx="8" fill="#2563eb"/>
  <text x="130" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#ffffff">used block</text>
  <text x="360" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#ffffff">free block</text>
  <text x="590" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#ffffff">used block</text>
  <line x1="450" y1="90" x2="500" y2="90" stroke="#111827" stroke-width="4"/>
  <polygon points="495,82 515,90 495,98" fill="#111827"/>
  <text x="475" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111827">next</text>
</svg>
